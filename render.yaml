services:
  - type: web
    name: pan-majster
    runtime: docker
    branch: pan-majster
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: pan-majster-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://pan-majster.onrender.com
      - key: MEDIA_ROOT
        value: /var/data
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: panmajster
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: Pan Majster <noreply@panmajster.pl>
      - key: ADMIN_EMAILS
        sync: false
