services:
  - type: web
    name: pan-majster
    runtime: docker
    branch: pan-majster
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://pan-majster.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: panmajster
      - key: STORAGE_PROVIDER
        value: database
      - key: MAX_UPLOAD_MB
        value: "12"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: Pan Majster <noreply@panmajster.pl>
      - key: ADMIN_EMAILS
        sync: false
