<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17261f">
  <title>Pan Majster</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101713;
      color: #f4f2e8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 15%, rgba(220, 166, 66, .20), transparent 30rem),
        linear-gradient(145deg, #101713, #1d2c24);
    }

    main {
      width: min(880px, calc(100% - 32px));
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid rgba(244, 242, 232, .14);
      border-radius: 28px;
      background: rgba(19, 30, 24, .76);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
      backdrop-filter: blur(16px);
    }

    .badge {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(220, 166, 66, .12);
      color: #edc77d;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e0aa46;
      box-shadow: 0 0 0 5px rgba(224, 170, 70, .12);
    }

    h1 {
      margin: 24px 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(58px, 11vw, 112px);
      font-weight: 500;
      letter-spacing: -.06em;
      line-height: .86;
    }

    p {
      max-width: 560px;
      margin: 26px 0 0;
      color: #b9c2bb;
      font-size: clamp(17px, 2.4vw, 21px);
      line-height: 1.6;
    }

    footer {
      margin-top: 52px;
      color: #77827b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot"></span> Srodowisko robocze</span>
    <h1>Pan<br>Majster</h1>
    <p>Nowy projekt jest gotowy do budowy. Ta strona potwierdza, ze niezalezne srodowisko aplikacji dziala prawidlowo.</p>
    <footer>Wersja startowa 0.1.0</footer>
  </main>
</body>
</html>
