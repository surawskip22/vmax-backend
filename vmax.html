<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V-Max Time Tracker</title>
  <style>
    :root {
      --primary: #0b57d0;
      --success: #188038;
      --warning: #f29900;
      --danger: #b3261e;
      --bg: #f0f4f9;
      --card-bg: #ffffff;
      --text: #1f1f1f;
      --muted: #667085;
      --border: #d1d5db;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, #f7f9ff, #eef2f7); color: var(--text); padding: 16px; }
    .shell { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
    .hero { text-align: center; padding: 10px 0 4px; }
    .hero h1 { margin: 0; font-size: clamp(30px, 5vw, 54px); letter-spacing: -0.03em; }
    .hero p { margin: 10px 0 0; color: var(--muted); font-weight: 700; }
    .card { background: rgba(255,255,255,.86); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08); padding: 22px; }
    .grid-2 { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 900; text-transform: uppercase; }
    input, select, button { width: 100%; border-radius: 14px; border: 1px solid var(--border); padding: 14px 16px; font-size: 16px; }
    input, select { background: #fff; outline: none; }
    button { border: none; cursor: pointer; font-weight: 900; transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease; }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 12px 24px rgba(11,87,208,.22); }
    .btn-success { background: var(--success); color: #fff; box-shadow: 0 12px 24px rgba(24,128,56,.18); }
    .btn-danger { background: #fff5f5; color: var(--danger); border: 1px solid #f5b5b5; }
    .btn-ghost { background: #fff; color: var(--text); }
    .muted { color: var(--muted); }
    .status-box { padding: 18px; border-radius: 16px; text-align: center; font-weight: 900; border: 1px solid #e5e7eb; background: #f7f8fb; color: #5f6368; }
    .status-on { background: #e6f4ea; color: var(--success); border-color: #ceead6; }
    .section-title { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .section-title h2, .section-title h3 { margin: 0; font-size: 18px; }
    .badge { display: inline-block; padding: 7px 12px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 13px; font-weight: 800; }
    .hidden { display: none !important; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border-bottom: 1px solid #edf0f4; padding: 12px 10px; text-align: left; }
    th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .day-row td { background: #f8fafc; font-weight: 800; }
    .admin-session { border: 1px solid #e5e7eb; border-left: 6px solid var(--primary); border-radius: 14px; padding: 14px; margin-bottom: 10px; background: #fff; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .admin-session small { color: var(--muted); display: block; margin-top: 4px; }
    .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .admin-actions button { width: auto; padding: 12px 16px; }
    @media (max-width: 820px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      body { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>V-Max Time Tracker</h1>
      <p>Rejestrator czasu pracy bez planningu.</p>
    </section>

    <section class="card" id="loginCard">
      <div class="grid-3">
        <label>Login
          <input id="loginInput" list="usersList" autocomplete="username" placeholder="Piotrek">
          <datalist id="usersList"></datalist>
        </label>
        <label>PIN
          <input id="pinInput" type="password" autocomplete="current-password" placeholder="123">
        </label>
        <button class="btn-primary" onclick="login()">Zaloguj</button>
      </div>
      <div id="loginStatus" class="muted" style="margin-top: 12px; font-weight: 700;"></div>
    </section>

    <section id="dashboard" class="hidden" style="display:grid; gap:18px;">
      <section class="card">
        <div class="section-title">
          <h2 id="whoText">Pracownik</h2>
          <div class="admin-actions">
            <button class="btn-ghost" onclick="changeMyPin()">Zmien PIN</button>
            <button class="btn-danger" onclick="logout()">Wyloguj</button>
          </div>
        </div>
        <div id="statusBanner" class="status-box">Status...</div>
      </section>

      <section class="card">
        <div class="section-title">
          <h3>Rejestracja</h3>
          <span class="badge" id="roleBadge">EMPLOYEE</span>
        </div>
        <div class="grid-3">
          <label>Aktywnosc
            <select id="taskSelect"></select>
          </label>
          <label>Okres historii
            <input type="month" id="histMonth" onchange="loadHistory()">
          </label>
          <button class="btn-success" onclick="refreshActiveTask()">Odsluz widok</button>
        </div>
        <div class="admin-actions" style="margin-top:12px;">
          <button class="btn-success" onclick="startDay()">Rozpocznij dzien</button>
          <button class="btn-primary" onclick="changeTask()">Zatwierdz zmiane</button>
          <button class="btn-danger" onclick="stopDay()">Zakoncz prace</button>
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <h3>Twoja historia</h3>
          <span class="badge" id="monthTotalBadge">Suma: 0h 0m</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Zadanie</th>
              <th>Godziny</th>
              <th style="text-align:right;">Suma</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="3" class="muted" style="text-align:center; padding:24px;">Brak danych</td></tr>
          </tbody>
        </table>
      </section>

      <section class="card hidden" id="adminCard">
        <div class="section-title">
          <h3>Sesje na zywo</h3>
          <div class="admin-actions">
            <button class="btn-ghost" onclick="loadActiveSessions()">Odsluz</button>
            <button class="btn-danger" onclick="closeAllSessions()">Zamknij wszystkie</button>
          </div>
        </div>
        <div id="activeSessions"></div>
      </section>
    </section>
  </main>

  <script>
    const state = {
      currentUser: "",
      currentRole: "",
      activities: [],
    };

    const api = async (endpoint, method = 'GET', body = null) => {
      const options = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) options.body = JSON.stringify(body);
      const res = await fetch('/api' + endpoint, options);
      const rawText = await res.text();
      let payload = null;
      try { payload = rawText ? JSON.parse(rawText) : null; } catch (_) {}
      if (!res.ok) {
        throw new Error((payload && payload.detail) ? payload.detail : (rawText || 'Blad serwera'));
      }
      return payload || {};
    };

    const parseTime = (value) => {
      const match = String(value || '').match(/(\d+)h\s*(\d+)m/);
      return match ? (parseInt(match[1], 10) * 60 + parseInt(match[2], 10)) : 0;
    };

    const formatMins = (mins) => `${Math.floor(mins / 60)}h ${mins % 60}m`;

    function todayMonth() {
      const now = new Date();
      return now.toISOString().slice(0, 7);
    }

    function setLoggedIn(user) {
      state.currentUser = user.name || '';
      state.currentRole = String(user.role || 'EMPLOYEE').toUpperCase();
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('whoText').textContent = `${state.currentUser} (${state.currentRole})`;
      document.getElementById('roleBadge').textContent = state.currentRole;
      document.getElementById('adminCard').classList.toggle('hidden', !['ADMIN', 'SUPER_ADMIN', 'MANAGER', 'TEAM_LEADER'].includes(state.currentRole));
      document.getElementById('histMonth').value = todayMonth();
    }

    function setLoggedOut() {
      state.currentUser = '';
      state.currentRole = '';
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('loginInput').value = '';
      document.getElementById('pinInput').value = '';
      document.getElementById('loginStatus').textContent = '';
      document.getElementById('historyBody').innerHTML = '<tr><td colspan="3" class="muted" style="text-align:center; padding:24px;">Brak danych</td></tr>';
      document.getElementById('statusBanner').textContent = 'Status...';
      document.getElementById('adminCard').classList.add('hidden');
      document.getElementById('activeSessions').innerHTML = '';
      document.getElementById('monthTotalBadge').textContent = 'Suma: 0h 0m';
    }

    function renderTasks(activities) {
      const select = document.getElementById('taskSelect');
      const options = activities.length ? activities : ['Praca'];
      select.innerHTML = options.map((name) => `<option value="${name}">${name}</option>`).join('');
    }

    function renderHistory(payload) {
      const rows = [];
      let totalMins = 0;
      const grouped = {};
      const history = Array.isArray(payload.hist) ? payload.hist : [];

      history.forEach((item) => {
        if (!grouped[item.data]) grouped[item.data] = [];
        grouped[item.data].push(item);
      });

      Object.keys(grouped).sort((a, b) => b.localeCompare(a)).forEach((date) => {
        let dayMins = 0;
        grouped[date].forEach((item) => {
          const mins = parseTime(item.czas);
          dayMins += mins;
          totalMins += mins;
        });
        rows.push(`<tr class="day-row"><td colspan="3">${date} <span style="float:right; color: var(--primary);">Sigma ${formatMins(dayMins)}</span></td></tr>`);
        grouped[date].forEach((item) => {
          rows.push(`<tr><td><b>${item.zadanie}</b></td><td>${item.start} - ${item.koniec}</td><td style="text-align:right;">${item.czas}</td></tr>`);
        });
      });

      document.getElementById('historyBody').innerHTML = rows.length
        ? rows.join('')
        : '<tr><td colspan="3" class="muted" style="text-align:center; padding:24px;">Brak wpisow</td></tr>';
      document.getElementById('monthTotalBadge').textContent = `Suma: ${formatMins(totalMins)}`;

      if (payload.currentTask) {
        document.getElementById('statusBanner').className = 'status-box status-on';
        document.getElementById('statusBanner').textContent = `TRWA: ${payload.currentTask.name}`;
      } else {
        document.getElementById('statusBanner').className = 'status-box';
        document.getElementById('statusBanner').textContent = 'Offline';
      }
    }

    async function loadConfig() {
      const data = await api('/config');
      state.activities = Array.isArray(data.aktywnosci) ? data.aktywnosci : [];
      renderTasks(state.activities);

      const users = Array.isArray(data.pracownicy) ? data.pracownicy : [];
      document.getElementById('usersList').innerHTML = users.map((name) => `<option value="${name}">`).join('');
    }

    async function loadHistory() {
      if (!state.currentUser) return;
      const payload = await api('/user/history', 'POST', {
        username: state.currentUser,
        month: document.getElementById('histMonth').value,
      });
      renderHistory(payload);
    }

    async function loadActiveSessions() {
      if (!document.getElementById('adminCard') || document.getElementById('adminCard').classList.contains('hidden')) return;
      const sessions = await api('/admin/active-sessions');
      const container = document.getElementById('activeSessions');
      const tasks = Object.keys(sessions || {});
      if (!tasks.length) {
        container.innerHTML = '<div class="muted" style="text-align:center; padding:18px;">Brak aktywnych sesji</div>';
        return;
      }

      container.innerHTML = tasks.map((task) => {
        const people = sessions[task] || [];
        const items = people.map((person) => `
          <div class="admin-session">
            <div>
              <strong>${person.user}</strong>
              <small>Start: ${person.start || '-'}${person.skaner ? ` | Skaner: ${person.skaner}` : ''}${person.wozek ? ` | Wozek: ${person.wozek}` : ''}</small>
            </div>
            <button class="btn-danger" style="width:auto;" onclick="closeSession('${person.user}')">Zamknij</button>
          </div>
        `).join('');
        return `<div style="margin-bottom:18px;"><div class="badge" style="margin-bottom:10px;">${task} (${people.length})</div>${items}</div>`;
      }).join('');
    }

    async function refreshActiveTask() {
      await loadHistory();
      if (state.currentRole !== 'EMPLOYEE' && state.currentRole !== 'SUPER_ADMIN' && state.currentRole !== 'ADMIN' && state.currentRole !== 'MANAGER' && state.currentRole !== 'TEAM_LEADER') {
        return;
      }
      if (state.currentRole === 'SUPER_ADMIN' || state.currentRole === 'ADMIN' || state.currentRole === 'MANAGER' || state.currentRole === 'TEAM_LEADER') {
        loadActiveSessions();
      }
    }

    async function login() {
      const username = document.getElementById('loginInput').value.trim();
      const pin = document.getElementById('pinInput').value.trim();
      if (!username || !pin) {
        document.getElementById('loginStatus').textContent = 'Podaj login i PIN.';
        return;
      }

      try {
        const user = await api('/auth/login', 'POST', { username, pin });
        setLoggedIn(user);
        await loadConfig();
        await loadHistory();
        if (['ADMIN', 'SUPER_ADMIN', 'MANAGER', 'TEAM_LEADER'].includes(state.currentRole)) {
          await loadActiveSessions();
        }
      } catch (err) {
        document.getElementById('loginStatus').textContent = err.message;
      }
    }

    async function startDay() {
      if (!state.currentUser) return;
      const task = document.getElementById('taskSelect').value || 'Praca';
      await api('/user/action', 'POST', {
        username: state.currentUser,
        type: 'START',
        task,
        month: document.getElementById('histMonth').value,
      });
      await loadHistory();
    }

    async function changeTask() {
      if (!state.currentUser) return;
      const task = document.getElementById('taskSelect').value || 'Praca';
      await api('/user/action', 'POST', {
        username: state.currentUser,
        type: 'TASK',
        task,
        month: document.getElementById('histMonth').value,
      });
      await loadHistory();
    }

    async function stopDay() {
      if (!state.currentUser) return;
      if (!confirm('Zakonczyc prace?')) return;
      await api('/user/action', 'POST', {
        username: state.currentUser,
        type: 'STOP',
        month: document.getElementById('histMonth').value,
      });
      await loadHistory();
    }

    async function closeSession(username) {
      await api('/admin/live-session/close', 'POST', { username });
      await loadActiveSessions();
      await loadHistory();
    }

    async function closeAllSessions() {
      if (!confirm('Zamknac wszystkie sesje?')) return;
      await api('/admin/live-session/close-all', 'POST');
      await loadActiveSessions();
      await loadHistory();
    }

    async function changeMyPin() {
      const newPin = prompt('Nowy PIN');
      if (!newPin) return;
      const oldPin = prompt('Stary PIN');
      const result = await api('/auth/change-pin', 'POST', {
        name: state.currentUser,
        oldPin: oldPin || '',
        newPin,
        isAdmin: ['ADMIN', 'SUPER_ADMIN', 'MANAGER', 'TEAM_LEADER'].includes(state.currentRole),
      });
      alert(result.msg || 'Zapisano');
    }

    function logout() {
      setLoggedOut();
    }

    async function init() {
      await loadConfig();
      document.getElementById('histMonth').value = todayMonth();
      setLoggedOut();
    }

    init();
  </script>
</body>
</html>
